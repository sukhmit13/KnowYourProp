<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Instrument Serif";font-weight:400;src:url("ogfonts/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:400;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:500;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:600;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:700;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2")}
  :root{--paper:#faf9f6;--wash:#f4f2ec;--card:#fff;--ink:#141414;--ink2:#54544f;--muted:#8b8a84;--line:#e7e5df;
    --indigo:#2b3a9e;--indigoSoft:#eef0fb;--good:#2f7d3f;--ctablue:#1f6fd6;--upn:#2f7d3f;--upnw:#b26c07;
    --sans:"Inter",sans-serif;--disp:"Instrument Serif",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f2ec;font-family:var(--sans);color:var(--ink);padding:30px}
  .wrap{max-width:1040px;margin:0 auto}
  .lbl{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

  .mcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;display:flex;flex-direction:column}
  .mh{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .mh .ic{width:26px;height:26px;border-radius:7px;background:var(--indigoSoft);display:flex;align-items:center;justify-content:center;flex:none}
  .mh .ic svg{width:15px;height:15px;stroke:var(--indigo);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mh .t{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}

  /* the shared stop row: name+walk pinned to the top row, badges wrap beneath */
  .srow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .srow + .srow{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .srow .main{min-width:0}
  .srow .nm{font-size:15px;font-weight:700;color:var(--ink);line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dirchip{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.02em;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
  .lines{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .lb{font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:3px 9px;white-space:nowrap;line-height:1.2}
  .lb.blue{background:var(--ctablue)}.lb.upn{background:var(--upn)}.lb.upnw{background:var(--upnw)}
  .walk{flex:none;text-align:right;white-space:nowrap;color:var(--ink2)}
  .walk .n{font-family:var(--disp);font-size:22px;color:var(--ink);line-height:1}
  .walk .u{font-size:10.5px;color:var(--muted);margin-left:3px}
  .foot{font-size:10.5px;color:var(--muted);margin-top:12px;padding-top:11px;border-top:1px solid var(--line);line-height:1.45}
  .foot b{color:var(--ink2);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="lbl">Closest by mode</div>
  <div class="grid">

    <!-- CTA BUS -->
    <div class="mcard">
      <div class="mh"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H4z"/><path d="M4 16v2M20 16v2M4 10h16"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></svg></span><span class="t">CTA Bus</span></div>
      <div class="srow"><div class="main"><div class="nm">56 <span class="dirchip">↔ E–W</span></div></div><div class="walk"><span class="n">1</span><span class="u">min walk</span></div></div>
      <div class="srow"><div class="main"><div class="nm">9 <span class="dirchip">↕ N–S</span></div></div><div class="walk"><span class="n">1</span><span class="u">min walk</span></div></div>
      <div class="foot">Covers both <b>N–S &amp; E–W</b> travel</div>
    </div>

    <!-- CTA L -->
    <div class="mcard">
      <div class="mh"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21l2-3M16 21l-2-3M5 11h14"/></svg></span><span class="t">CTA L</span></div>
      <div class="srow">
        <div class="main"><div class="nm">Division</div><div class="lines"><span class="lb blue">Blue Line</span></div></div>
        <div class="walk"><span class="n">1</span><span class="u">min walk</span></div>
      </div>
      <div class="foot"><b>0.02 mi</b> · nearest of 5 stations within 2 mi</div>
    </div>

    <!-- METRA (multi-line, now aligned) -->
    <div class="mcard">
      <div class="mh"><span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21l2-3M16 21l-2-3M5 11h14"/></svg></span><span class="t">Metra</span></div>
      <div class="srow">
        <div class="main"><div class="nm">Clybourn</div><div class="lines"><span class="lb upn">Union Pacific North</span><span class="lb upnw">Union Pacific Northwest</span></div></div>
        <div class="walk"><span class="n">19</span><span class="u">min walk</span></div>
      </div>
      <div class="foot"><b>0.95 mi</b> · nearest of 3 stations within 2 mi</div>
    </div>

  </div>
</div>
</body>
</html>
