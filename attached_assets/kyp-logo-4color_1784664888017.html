<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#faf9f6;font-family:"JetBrains Mono",monospace;padding:36px}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8a84;text-align:center}
  .big{display:flex;justify-content:center;align-items:center;height:150px;background:#fff;border:1px solid #e5e2da;border-radius:16px}
  .row{display:flex;gap:14px}
  .tile{flex:1;border:1px solid #e5e2da;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .tile.dark{background:#0b0b0f;border-color:#0b0b0f}
  .tile.mid{background:#3a3a3a;border-color:#3a3a3a}
  .lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8b8a84}
  .tile.dark .lbl,.tile.mid .lbl{color:#9a9a9a}
  .navrow{display:flex;align-items:center;gap:11px;padding:12px 16px;background:#fff;border:1px solid #e5e2da;border-radius:12px}
  .word{font-family:"Instrument Serif",serif;font-size:21px;color:#141414}
  .icons{display:flex;align-items:flex-end;gap:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">KnowYourProp · 4-color streams · thicker · transparent favicon</div>

  <div class="big">
    <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2b3a9e"/>
      <path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/>
      <path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2f7d3f"/>
      <path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#d13b26"/>
    </svg>
  </div>

  <div class="navrow">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2b3a9e"/>
      <path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/>
      <path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2f7d3f"/>
      <path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#d13b26"/>
    </svg>
    <span class="word">KnowYourProp</span>
  </div>

  <div class="cap" style="margin-top:8px">Favicon — transparent, full-bleed — on light / grey / dark tabs · at 16px &amp; 32px</div>
  <div class="row">
    <div class="tile"><span class="lbl">Light tab</span><div class="icons">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round"><path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2b3a9e"/><path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/><path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2f7d3f"/><path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#d13b26"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2b3a9e"/><path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/><path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2f7d3f"/><path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#d13b26"/></svg>
    </div></div>
    <div class="tile mid"><span class="lbl">Grey tab</span><div class="icons">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round"><path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2b3a9e"/><path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/><path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2f7d3f"/><path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#d13b26"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2b3a9e"/><path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/><path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#2f7d3f"/><path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#d13b26"/></svg>
    </div></div>
    <div class="tile dark"><span class="lbl">Dark tab</span><div class="icons">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.1" stroke-linecap="round"><path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#5a6fd8"/><path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/><path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#49b063"/><path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#e5533f"/></svg>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M1.5 5 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#5a6fd8"/><path d="M1.5 10 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#f3b31f"/><path d="M1.5 15 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#49b063"/><path d="M1.5 20 q2.625 -2.4 5.25 0 t5.25 0 t5.25 0 t5.25 0" stroke="#e5533f"/></svg>
    </div></div>
  </div>
</div>
</body>
</html>
