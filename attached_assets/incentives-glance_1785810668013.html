<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Incentives Glance — Option A</title>
<style>
  @font-face{font-family:"Instrument Serif";font-weight:400;src:url("ogfonts/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:400;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:600;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:700;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2")}
  :root{
    --paper:#faf9f6;--card:#fff;--ink:#141414;--ink2:#54544f;--muted:#8b8a84;--line:#e7e5df;
    --indigo:#2b3a9e;
    --good:#2f7d3f;--goodSoft:#e9f4ec;--amber:#c98400;--amberSoft:#fbf1d3;--na:#8b8a84;--naSoft:#efeeea;
    --sans:"Inter",sans-serif;--disp:"Instrument Serif",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f2ec;font-family:var(--sans);color:var(--ink);padding:34px}
  .wrap{max-width:1120px;margin:0 auto}

  .sh{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .sh .sq{width:11px;height:11px;border-radius:3px;background:var(--indigo);flex:none}
  .sh .t{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
  .sh .ca{margin-left:auto;color:var(--muted)}

  .glance{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .gt{border-radius:11px;padding:13px 16px;display:flex;align-items:center;gap:11px}
  .gt.gr{background:var(--goodSoft)} .gt.am{background:var(--amberSoft)} .gt.na{background:var(--naSoft)}
  .gt .mk{font-size:15px;font-weight:700;flex:none}
  .gt.gr .mk{color:var(--good)} .gt.am .mk{color:var(--amber)} .gt.na .mk{color:var(--na)}
  .gt .n{font-family:var(--disp);font-size:30px;line-height:1;flex:none}
  .gt.gr .n{color:var(--good)} .gt.am .n{color:var(--amber)} .gt.na .n{color:var(--ink)}
  .gt .l{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.2}
</style>
</head>
<body>
<div class="wrap">
  <div class="sh"><span class="sq"></span><span class="t">Location-Based Incentives</span><span class="ca">▾</span></div>
  <div class="glance">
    <div class="gt gr"><span class="mk">✓</span><span class="n">5</span><span class="l">Likely relevant</span></div>
    <div class="gt am"><span class="mk">!</span><span class="n">9</span><span class="l">Needs confirmation</span></div>
    <div class="gt na"><span class="mk">&times;</span><span class="n">32</span><span class="l">Not applicable</span></div>
  </div>
</div>
</body>
</html>
