<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Instrument Serif";font-weight:400;src:url("ogfonts/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:400;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:500;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:600;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2") format("woff2")}
  @font-face{font-family:"Inter";font-weight:700;src:url("ogfonts/node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2") format("woff2")}
  :root{--paper:#faf9f6;--wash:#f4f2ec;--card:#fff;--ink:#141414;--ink2:#54544f;--muted:#8b8a84;--line:#e7e5df;
    --indigo:#2b3a9e;--indigoSoft:#eef0fb;--good:#2f7d3f;--sans:"Inter",sans-serif;--disp:"Instrument Serif",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,monospace;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#f4f2ec;font-family:var(--sans);color:var(--ink);padding:30px}
  .wrap{max-width:640px;margin:0 auto}
  .cap{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a897f;margin:0 0 8px 2px}
  .cardbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px;box-shadow:0 1px 3px rgba(20,20,20,.04)}
  .sh{display:flex;align-items:center;gap:9px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .sh .sq{width:11px;height:11px;border-radius:3px;background:var(--indigo);flex:none}
  .sh .t{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}

  /* name row: name left, big ward badge right */
  .namerow{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .name{font-family:var(--disp);font-size:34px;line-height:1.02;color:var(--ink);flex:1}
  .name .sub{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:0}
  .ward{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--indigoSoft);border:1px solid #dfe3f7;border-radius:12px;padding:9px 18px;min-width:74px}
  .ward .l{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--indigo);margin-bottom:1px}
  .ward .n{font-family:var(--disp);font-size:38px;line-height:1;color:var(--indigo)}

  .contact{display:flex;flex-direction:column;gap:11px}
  .cl{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--indigo);font-weight:500}
  .cl.addr{color:var(--ink2);font-weight:400}
  .cl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .cl.addr svg{stroke:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">Ward badge → bigger, right of the name</div>
  <div class="cardbox">
    <div class="sh"><span class="sq"></span><span class="t">Ward &amp; Alderperson</span></div>
    <div class="namerow">
      <div class="name">Daniel La Spata<div class="sub">Alderperson · since 2019</div></div>
      <div class="ward"><span class="l">Ward</span><span class="n">1</span></div>
    </div>
    <div class="contact">
      <div class="cl"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2z"/></svg>(872) 206-2685</div>
      <div class="cl"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="m22 6-10 7L2 6"/></svg>Ward01@cityofchicago.org</div>
      <div class="cl addr"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>1958 North Milwaukee Avenue, Chicago, IL 60647</div>
    </div>
  </div>
</div>
</body>
</html>
